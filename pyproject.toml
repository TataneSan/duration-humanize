[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "duration-humanize"
version = "1.0.0"
description = "Convert seconds to human durations and back (1h30m, ISO 8601, EN/FR)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.scripts]
duration-humanize = "duration_humanize.cli:main"

[tool.setuptools.packages.find]
include = ["duration_humanize*"]
